<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - Elite Sports</title>

    <!-- Link para o CSS da página -->
    <link rel="stylesheet" href="style.css" />

    <!-- Link para os ícones RemixIcon -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Cabeçalho da página -->
    <header class="topo">
      <!-- Logo da loja, clicável para ir para a página inicial -->
      <div
        class="logo"
        onclick="window.location.href = 'index.html'"
        style="cursor: pointer"
      >
        <img src="./img/logo.png" class="logo-img" />
        <span class="logo-text">Elite <strong>Sports</strong></span>
      </div>

      <!-- Área de ações do usuário -->
      <div class="acoes">
        <!-- Botão de voltar para a página anterior -->
        <span onclick="history.back()">
          <i class="ri-arrow-left-line"></i> Voltar
        </span>

        <!-- Botão para ir para a página inicial -->
        <span onclick="window.location.href = 'index.html'">
          <i class="ri-home-line"></i> Início
        </span>

        <!-- Área do usuário: mostra "Login" se não estiver logado ou nome do usuário quando logado -->
        <div class="conta-dropdown">
          <span id="usuarioLogadoNome" onclick="handleUsuarioClick()">
            <i class="ri-user-line"></i> <span id="nomeUsuario">Login</span>
            <i
              class="ri-arrow-down-s-line"
              id="setaDropdown"
              style="display: none"
            ></i>
            <!-- seta para abrir o menu -->
          </span>

          <!-- Menu dropdown do usuário (minha conta, meus pedidos, sair) -->
          <div id="dropdownMenu" class="dropdown-content">
            <button onclick="mostrarMinhaConta()">Minha Conta</button>
            <button onclick="mostrarMeusPedidos()">Meus Pedidos</button>
            <button onclick="sair()">Sair da conta</button>
          </div>
        </div>

        <!-- Carrinho de compras sempre por último -->
        <div class="carrinho" onclick="window.location.href = 'carrinhos.html'">
          <i class="ri-shopping-cart-line"></i>
          <span id="contador">0</span>
          <!-- quantidade de itens no carrinho -->
        </div>
      </div>
    </header>

    <!-- Menu de navegação principal -->
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="camisetas.html">Camisetas</a>
      <a href="shorts.html">Shorts</a>
    </nav>

    <!-- Área de login e cadastro -->
    <section class="login-container">
      <div class="login-card">
        <div class="login-logo">
          <img src="./img/logo.png" />
          <span style="color: #ffffff !important">
            Elite <strong style="color: #7c2cff !important">Sports</strong>
          </span>
        </div>

        <!-- Botões para alternar entre login e cadastro -->
        <div class="abas-login">
          <button id="btnLogin" class="aba-ativa" onclick="mostrarLogin()">
            Entrar
          </button>

          <button id="btnCadastro" onclick="mostrarCadastro()">
            Cadastrar
          </button>
        </div>

        <!-- LOGIN -->
        <div id="boxLogin">
          <h2>Bem-vindo de volta</h2>

          <p class="login-subtitulo">Entre na sua conta Elite Sports</p>

          <label>E-mail</label>

          <div class="campo-input">
            <i class="ri-mail-line"></i>

            <input
              type="email"
              id="loginEmail"
              placeholder="Digite seu e-mail"
            />
          </div>

          <label>Senha</label>

          <div class="campo-senha campo-input">
            <i class="ri-lock-line"></i>

            <input
              type="password"
              id="loginSenha"
              placeholder="Digite sua senha"
            />

            <i
              class="ri-eye-line olho"
              onclick="mostrarOcultarSenha('loginSenha', this)"
            >
            </i>
          </div>

          <button class="btn-principal" onclick="fazerLogin()">Entrar</button>

          <button class="btn-laranja" onclick="mostrarRedefinirSenha()">
            Esqueci minha senha
          </button>
        </div>

        <!-- CADASTRO -->
        <div id="boxCadastro" style="display: none">
          <h2>Criar conta</h2>

          <p class="login-subtitulo">
            Faça seu cadastro e compre seus produtos
          </p>

          <label>Nome</label>

          <div class="campo-input">
            <i class="ri-user-line"></i>

            <input
              type="text"
              id="cadastroNome"
              placeholder="Digite seu nome"
            />
          </div>

          <label>E-mail</label>

          <div class="campo-input">
            <i class="ri-mail-line"></i>

            <input
              type="email"
              id="cadastroEmail"
              placeholder="Digite seu e-mail"
            />
          </div>

          <label>CPF</label>

          <div class="campo-input">
            <i class="ri-bank-card-line"></i>

            <input
              type="text"
              id="cadastroCPF"
              placeholder="Digite seu CPF"
              maxlength="14"
              oninput="formatarCPF(this)"
            />
          </div>

          <label>Senha</label>

          <div class="campo-senha campo-input">
            <i class="ri-lock-line"></i>

            <input
              type="password"
              id="cadastroSenha"
              placeholder="Crie uma senha"
            />

            <i
              class="ri-eye-line olho"
              onclick="mostrarOcultarSenha('cadastroSenha', this)"
            >
            </i>
          </div>

          <label>Confirmar senha</label>

          <div class="campo-senha campo-input">
            <i class="ri-lock-line"></i>

            <input
              type="password"
              id="cadastroConfirmarSenha"
              placeholder="Repita a senha"
            />

            <i
              class="ri-eye-line olho"
              onclick="mostrarOcultarSenha('cadastroConfirmarSenha', this)"
            >
            </i>
          </div>

          <button class="btn-principal" onclick="cadastrarUsuario()">
            Cadastrar
          </button>
        </div>

        <!-- REDEFINIR SENHA -->
        <div
          class="redefinir-senha"
          id="boxRedefinirSenha"
          style="display: none"
        >
          <h2>Redefinir Senha</h2>

          <div id="emailStep">
            <label>E-mail cadastrado</label>

            <input
              type="email"
              id="emailRedefinir"
              placeholder="Digite seu e-mail"
            />

            <button onclick="verificarEmailRedefinir()">Confirmar</button>

            <p id="mensagemRedefinir"></p>
          </div>

          <div id="senhaStep" style="display: none">
            <label>Nova senha</label>

            <input type="password" id="novaSenha" placeholder="Nova senha" />

            <label>Confirmar senha</label>

            <input
              type="password"
              id="confirmarNovaSenha"
              placeholder="Repita a senha"
            />

            <button onclick="atualizarSenha()">Redefinir Senha</button>

            <p id="mensagemNovaSenha"></p>
          </div>

          <button onclick="voltarLogin()">Voltar para login</button>
        </div>

        <p id="mensagemLogin"></p>
      </div>
    </section>

    <script>
      /* =========================================================
   ELITE SPORTS - LOGIN / CADASTRO
   ========================================================= */

      /* =========================
   MENSAGENS
   ========================= */

      function mostrarMensagem(texto, cor) {
        const mensagem = document.getElementById("mensagemLogin");

        if (!mensagem) return;

        mensagem.innerText = texto;
        mensagem.style.color = cor;
        mensagem.style.textAlign = "center";
        mensagem.style.marginTop = "15px";
      }

      /* =========================
   TROCAR ENTRE LOGIN/CADASTRO
   ========================= */

      function mostrarLogin() {
        document.getElementById("boxLogin").style.display = "block";
        document.getElementById("boxCadastro").style.display = "none";
        document.getElementById("boxRedefinirSenha").style.display = "none";

        document.getElementById("btnLogin").classList.add("aba-ativa");
        document.getElementById("btnCadastro").classList.remove("aba-ativa");

        mostrarMensagem("", "");
      }

      function mostrarCadastro() {
        document.getElementById("boxLogin").style.display = "none";
        document.getElementById("boxCadastro").style.display = "block";
        document.getElementById("boxRedefinirSenha").style.display = "none";

        document.getElementById("btnCadastro").classList.add("aba-ativa");
        document.getElementById("btnLogin").classList.remove("aba-ativa");

        mostrarMensagem("", "");
      }

      /* =========================
   VALIDAÇÃO DE E-MAIL
   ========================= */

      function validarEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        return regex.test(email);
      }

      /* =========================
   VALIDAÇÃO CPF
   ========================= */

      function validarCPF(cpf) {
        cpf = cpf.replace(/[^\d]+/g, "");

        if (cpf.length !== 11) {
          return false;
        }

        if (/^(\d)\1+$/.test(cpf)) {
          return false;
        }

        let soma = 0;

        for (let i = 0; i < 9; i++) {
          soma += parseInt(cpf.charAt(i)) * (10 - i);
        }

        let resto = (soma * 10) % 11;

        if (resto === 10) {
          resto = 0;
        }

        if (resto !== parseInt(cpf.charAt(9))) {
          return false;
        }

        soma = 0;

        for (let i = 0; i < 10; i++) {
          soma += parseInt(cpf.charAt(i)) * (11 - i);
        }

        resto = (soma * 10) % 11;

        if (resto === 10) {
          resto = 0;
        }

        if (resto !== parseInt(cpf.charAt(10))) {
          return false;
        }

        return true;
      }

      /* =========================
   FORMATAÇÃO CPF
   ========================= */

      function formatarCPF(campo) {
        let cpf = campo.value.replace(/\D/g, "");

        if (cpf.length > 11) {
          cpf = cpf.slice(0, 11);
        }

        cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
        cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
        cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

        campo.value = cpf;
      }

      async function cadastrarUsuario() {
        const campos = [
          {
            id: "cadastroNome",
            nome: "Nome",
          },
          {
            id: "cadastroEmail",
            nome: "E-mail",
          },
          {
            id: "cadastroCPF",
            nome: "CPF",
          },
          {
            id: "cadastroSenha",
            nome: "Senha",
          },
          {
            id: "cadastroConfirmarSenha",
            nome: "Confirmar senha",
          },
        ];

        /* REMOVE MARCAÇÕES ANTIGAS */

        campos.forEach((item) => {
          const campo = document.getElementById(item.id);

          const container = campo.closest(".campo-input");

          const label = container.previousElementSibling;

          label.innerHTML = item.nome;

          container.classList.remove("campo-obrigatorio");
        });

        /* VERIFICA CAMPOS VAZIOS */

        let temCampoVazio = false;

        campos.forEach((item) => {
          const campo = document.getElementById(item.id);

          if (campo.value.trim() === "") {
            const container = campo.closest(".campo-input");

            container.classList.add("campo-obrigatorio");

            temCampoVazio = true;
          }
        });

        if (temCampoVazio) {
          mostrarMensagem("Preencha todos os campos.", "#ff4d5a");

          return;
        }

        /* PEGA OS VALORES */

        const nome = document.getElementById("cadastroNome").value.trim();

        const email = document
          .getElementById("cadastroEmail")
          .value.trim()
          .toLowerCase();

        const cpf = document.getElementById("cadastroCPF").value.trim();

        const senha = document.getElementById("cadastroSenha").value;

        const confirmarSenha = document.getElementById(
          "cadastroConfirmarSenha",
        ).value;

        /* NOME */

        if (nome.length < 3) {
          mostrarMensagem(
            "O nome precisa ter pelo menos 3 caracteres.",
            "#ff4d5a",
          );

          return;
        }

        /* EMAIL */

        if (!validarEmail(email)) {
          mostrarMensagem("Digite um e-mail válido.", "#ff4d5a");

          return;
        }

        /* CPF */

        if (!validarCPF(cpf)) {
          mostrarMensagem("CPF inválido.", "#ff4d5a");

          return;
        }

        /* SENHA */

        if (senha.length < 6) {
          mostrarMensagem(
            "A senha precisa ter pelo menos 6 caracteres.",
            "#ff4d5a",
          );

          return;
        }

        /* CONFIRMAÇÃO DA SENHA */

        if (senha !== confirmarSenha) {
          mostrarMensagem("As senhas não conferem.", "#ff4d5a");

          return;
        }

        /* REMOVE PONTOS E TRAÇO DO CPF */

        const cpfNumeros = cpf.replace(/\D/g, "");

        /* ENVIA O CADASTRO PARA A API */

        try {
          const resposta = await fetch("http://localhost:3000/api/usuarios", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              nome: nome,
              email: email,
              cpf: cpfNumeros,
              telefone: "",
              senha: senha,
            }),
          });

          const dados = await resposta.json();

          /* ERRO RETORNADO PELA API */

          if (!resposta.ok) {
            mostrarMensagem(
              dados.mensagem || "Não foi possível realizar o cadastro.",
              "#ff4d5a",
            );

            return;
          }

          /* CADASTRO REALIZADO */

          mostrarMensagem("Cadastro realizado com sucesso!", "#4ade80");

          /*
            TEMPORÁRIO:
            mantém somente os dados da sessão no navegador.

            O usuário em si já está salvo no MySQL.
            Depois vamos substituir isso por login/token.
        */

          const usuarioLogado = {
            id_usuario: dados.id_usuario,
            nome: nome,
            email: email,
            cpf: cpfNumeros,
            telefone: "",
          };

          localStorage.setItem("usuarioLogado", JSON.stringify(usuarioLogado));

          /* REDIRECIONA */

          setTimeout(() => {
            const voltarDepoisLogin = localStorage.getItem("voltarDepoisLogin");

            if (voltarDepoisLogin) {
              localStorage.removeItem("voltarDepoisLogin");

              window.location.href = voltarDepoisLogin;
            } else {
              window.location.href = "index.html";
            }
          }, 800);
        } catch (erro) {
          console.error("Erro ao cadastrar:", erro);

          mostrarMensagem(
            "Não foi possível conectar com o servidor.",
            "#ff4d5a",
          );
        }
      }

      /* =========================================================
   LOGIN
   ========================================================= */

      async function fazerLogin() {
        const email = document
          .getElementById("loginEmail")
          .value.trim()
          .toLowerCase();

        const senha = document.getElementById("loginSenha").value;

        if (email === "" || senha === "") {
          mostrarMensagem("Digite e-mail e senha.", "#ff5c5c");

          return;
        }

        try {
          const resposta = await fetch("http://localhost:3000/api/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              email: email,
              senha: senha,
            }),
          });

          const dados = await resposta.json();

          if (!resposta.ok) {
            mostrarMensagem(
              dados.mensagem || "E-mail ou senha incorretos.",
              "#ff5c5c",
            );

            return;
          }

          const usuarioLogado = {
            id_usuario: dados.usuario.id_usuario,
            nome: dados.usuario.nome,
            email: dados.usuario.email,
            cpf: dados.usuario.cpf || "",
            telefone: dados.usuario.telefone || "",
          };

          localStorage.setItem("usuarioLogado", JSON.stringify(usuarioLogado));

          atualizarNomeUsuarioHeader();

          mostrarMensagem("Login realizado com sucesso!", "#4ade80");

          setTimeout(() => {
            const voltarDepoisLogin = localStorage.getItem("voltarDepoisLogin");

            if (voltarDepoisLogin) {
              localStorage.removeItem("voltarDepoisLogin");

              window.location.href = voltarDepoisLogin;
            } else {
              window.location.href = "index.html";
            }
          }, 800);
        } catch (erro) {
          console.error("Erro ao realizar login:", erro);

          mostrarMensagem(
            "Não foi possível conectar com o servidor.",
            "#ff5c5c",
          );
        }
      }

      /* =========================================================
   MOSTRAR / OCULTAR SENHA
   ========================================================= */

      function mostrarOcultarSenha(idCampo, icone) {
        const campo = document.getElementById(idCampo);

        if (!campo) return;

        if (campo.type === "password") {
          campo.type = "text";

          icone.classList.remove("ri-eye-line");

          icone.classList.add("ri-eye-off-line");
        } else {
          campo.type = "password";

          icone.classList.remove("ri-eye-off-line");

          icone.classList.add("ri-eye-line");
        }
      }

      /* =========================================================
   REDEFINIR SENHA
   ========================================================= */

      function mostrarRedefinirSenha() {
        document.getElementById("boxLogin").style.display = "none";
        document.getElementById("boxCadastro").style.display = "none";
        document.getElementById("boxRedefinirSenha").style.display = "block";

        document.getElementById("emailStep").style.display = "block";
        document.getElementById("senhaStep").style.display = "none";

        document.getElementById("emailRedefinir").value = "";

        document.getElementById("mensagemRedefinir").innerText = "";

        const mensagemNova = document.getElementById("mensagemNovaSenha");

        if (mensagemNova) {
          mensagemNova.innerText = "";
        }
      }

      async function verificarEmailRedefinir() {
        const email = document
          .getElementById("emailRedefinir")
          .value.trim()
          .toLowerCase();

        const mensagem = document.getElementById("mensagemRedefinir");

        if (email === "") {
          mensagem.style.color = "#ff5c5c";

          mensagem.innerText = "Digite seu e-mail.";

          return;
        }

        try {
          const resposta = await fetch(
            "http://localhost:3000/api/verificar-email",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                email: email,
              }),
            },
          );

          const dados = await resposta.json();

          if (!resposta.ok) {
            mensagem.style.color = "#ff5c5c";

            mensagem.innerText =
              dados.mensagem || "Não foi possível verificar o e-mail.";

            return;
          }

          // Guarda somente o e-mail que será usado
          // na próxima etapa
          window.usuarioRedefinir = {
            email: email,
          };

          document.getElementById("emailStep").style.display = "none";

          document.getElementById("senhaStep").style.display = "block";
        } catch (erro) {
          console.error("Erro ao verificar e-mail:", erro);

          mensagem.style.color = "#ff5c5c";

          mensagem.innerText = "Não foi possível conectar com o servidor.";
        }
      }

      async function atualizarSenha() {
        const nova = document.getElementById("novaSenha").value;

        const repetir = document.getElementById("confirmarNovaSenha").value;

        const mensagem = document.getElementById("mensagemNovaSenha");

        if (nova.length < 6) {
          mensagem.style.color = "#ff5c5c";

          mensagem.innerText = "A senha precisa ter pelo menos 6 caracteres.";

          return;
        }

        if (nova !== repetir) {
          mensagem.style.color = "#ff5c5c";

          mensagem.innerText = "As senhas não conferem.";

          return;
        }

        if (!window.usuarioRedefinir || !window.usuarioRedefinir.email) {
          mensagem.style.color = "#ff5c5c";

          mensagem.innerText = "Não foi possível identificar o usuário.";

          return;
        }

        try {
          const resposta = await fetch(
            "http://localhost:3000/api/redefinir-senha",
            {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                email: window.usuarioRedefinir.email,

                novaSenha: nova,
              }),
            },
          );

          const dados = await resposta.json();

          if (!resposta.ok) {
            mensagem.style.color = "#ff5c5c";

            mensagem.innerText =
              dados.mensagem || "Não foi possível redefinir a senha.";

            return;
          }

          mensagem.style.color = "#4ade80";

          mensagem.innerText = "Senha redefinida com sucesso!";

          // Limpa os campos
          document.getElementById("novaSenha").value = "";

          document.getElementById("confirmarNovaSenha").value = "";

          window.usuarioRedefinir = null;

          setTimeout(() => {
            voltarLogin();
          }, 1500);
        } catch (erro) {
          console.error("Erro ao redefinir senha:", erro);

          mensagem.style.color = "#ff5c5c";

          mensagem.innerText = "Não foi possível conectar com o servidor.";
        }
      }

      function voltarLogin() {
        document.getElementById("boxRedefinirSenha").style.display = "none";

        document.getElementById("boxCadastro").style.display = "none";

        document.getElementById("boxLogin").style.display = "block";

        document.getElementById("btnLogin").classList.add("aba-ativa");

        document.getElementById("btnCadastro").classList.remove("aba-ativa");
      }

      /* =========================================================
   CARRINHO
   ========================================================= */

      function atualizarContador() {
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        let total = 0;

        carrinho.forEach((produto) => {
          total += produto.qtd || 1;
        });

        const contador = document.getElementById("contador");

        if (!contador) return;

        contador.innerText = total > 9 ? "9+" : total;
      }

      /* =========================================================
   HEADER / USUÁRIO
   ========================================================= */

      function atualizarNomeUsuarioHeader() {
        const usuario =
          JSON.parse(localStorage.getItem("usuarioLogado")) || null;

        const nomeEl = document.getElementById("nomeUsuario");

        const seta = document.getElementById("setaDropdown");

        if (!nomeEl) return;

        if (usuario) {
          nomeEl.innerText = usuario.nome || "Minha Conta";

          if (seta) {
            seta.style.display = "inline";
          }
        } else {
          nomeEl.innerText = "Login";

          if (seta) {
            seta.style.display = "none";
          }
        }
      }

      function handleUsuarioClick() {
        const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

        if (!usuario) {
          window.location.href = "Entrar.html";

          return;
        }

        toggleDropdown();
      }

      function toggleDropdown() {
        const menu = document.getElementById("dropdownMenu");

        const seta = document.getElementById("setaDropdown");

        if (!menu) return;

        menu.classList.toggle("show");

        if (seta) {
          seta.classList.toggle("girar", menu.classList.contains("show"));
        }
      }

      /* =========================================================
   MINHA CONTA / MEUS PEDIDOS
   ========================================================= */

      function mostrarMinhaConta() {
        const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

        if (!usuario) {
          window.location.href = "Entrar.html";

          return;
        }

        window.location.href = "minha-conta.html";
      }

      function mostrarMeusPedidos() {
        const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

        if (!usuario) {
          window.location.href = "Entrar.html";

          return;
        }

        window.location.href = "meus-pedidos.html";
      }

      /* =========================================================
   SAIR
   ========================================================= */

      function sair() {
        localStorage.removeItem("usuarioLogado");

        atualizarNomeUsuarioHeader();

        const menu = document.getElementById("dropdownMenu");

        if (menu) {
          menu.classList.remove("show");
        }

        window.location.href = "index.html";
      }

      /* =========================================================
   FECHAR DROPDOWN AO CLICAR FORA
   ========================================================= */

      document.addEventListener("click", function (event) {
        const areaUsuario = document.getElementById("usuarioLogadoNome");

        const menu = document.getElementById("dropdownMenu");

        const seta = document.getElementById("setaDropdown");

        if (!areaUsuario || !menu) {
          return;
        }

        if (
          !areaUsuario.contains(event.target) &&
          !menu.contains(event.target)
        ) {
          menu.classList.remove("show");

          if (seta) {
            seta.classList.remove("girar");
          }
        }
      });

      /* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

      document.addEventListener("DOMContentLoaded", function () {
        atualizarNomeUsuarioHeader();
        atualizarContador();
      });
    </script>
  </body>
</html>
