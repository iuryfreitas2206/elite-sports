<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Conta - Elite Sports</title>

    <!-- Link para o CSS da página -->
    <link rel="stylesheet" href="style.css" />

    <!-- Link para os ícones RemixIcon -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Container geral da área da conta -->
    <div class="painel-conta">
      <!-- Cabeçalho superior com nome do usuário -->
      <header class="painel-topo">
        <div class="painel-usuario">
          <i class="ri-user-line"></i>
          <strong id="nomeTopo">Usuário</strong>
        </div>

        <!-- Botões de navegação no topo -->
        <div class="painel-acoes-topo">
          <span onclick="history.back()">
            <i class="ri-arrow-left-line"></i> Voltar
          </span>

          <span onclick="window.location.href = 'index.html'">
            <i class="ri-home-line"></i> Início
          </span>
        </div>
      </header>

      <!-- Conteúdo principal -->
      <div class="painel-layout">
        <!-- Menu lateral -->
        <aside class="painel-menu">
          <!-- Link ativo para Minha Conta -->
          <a href="minha-conta.html" class="menu-conta ativo">
            <i class="ri-user-line"></i>
            Minha conta
          </a>

          <!-- Link para Meus Pedidos -->
          <a href="meus-pedidos.html" class="menu-conta">
            <i class="ri-shopping-bag-line"></i>
            Meus pedidos
          </a>

          <!-- Botão de sair da conta -->
          <button class="btn-sair-conta" onclick="sairConta()">
            <i class="ri-logout-box-line"></i>
            Sair da conta
          </button>
        </aside>

        <!-- Área principal da tela -->
        <main class="painel-conteudo">
          <div class="painel-cabecalho">
            <div>
              <h1>Minha conta</h1>
              <p>Veja e edite suas informações pessoais.</p>
            </div>

            <!-- Botão para liberar edição dos dados -->
            <button class="btn-editar" onclick="editarDados()">
              <i class="ri-pencil-line"></i>
              Editar dados
            </button>
          </div>

          <!-- Card com os dados do usuário -->
          <section class="dados-card">
            <div class="linha-dado">
              <div class="icone-dado">
                <i class="ri-user-line"></i>
              </div>
              <div>
                <strong>Nome</strong>
                <input type="text" id="perfilNome" disabled />
              </div>
            </div>

            <div class="linha-dado">
              <div class="icone-dado">
                <i class="ri-mail-line"></i>
              </div>
              <div>
                <strong>E-mail</strong>
                <input type="text" id="perfilEmail" disabled />
              </div>
            </div>

            <div class="linha-dado">
              <div class="icone-dado">
                <i class="ri-bank-card-line"></i>
              </div>
              <div>
                <strong>CPF</strong>
                <input type="text" id="perfilCPF" disabled />
              </div>
            </div>

            <div class="linha-dado">
              <div class="icone-dado">
                <i class="ri-phone-line"></i>
              </div>
              <div>
                <strong>Telefone</strong>
                <input
                  type="text"
                  id="perfilTelefone"
                  disabled
                  placeholder="Adicionar telefone"
                />
              </div>
            </div>
          </section>

          <!-- Botão para salvar alterações -->
          <button
            id="btnSalvarDados"
            class="btn-salvar-dados"
            onclick="salvarDados()"
            style="display: none"
          >
            Salvar alterações
          </button>
        </main>
      </div>
    </div>

    <script>
      // ==========================================
      // CONFIGURAÇÃO DA API
      // ==========================================

      const API_URL = "http://localhost:3000";

      // ==========================================
      // CARREGAR DADOS DO USUÁRIO
      // ==========================================

      async function carregarDadosUsuario() {
        const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));

        // Se não estiver logado
        if (!usuarioLogado || !usuarioLogado.id_usuario) {
          window.location.href = "Entrar.html";
          return;
        }

        try {
          const resposta = await fetch(
            `${API_URL}/api/usuarios/${usuarioLogado.id_usuario}`,
          );

          const dados = await resposta.json();

          if (!resposta.ok) {
            alert(
              dados.mensagem ||
                "Não foi possível carregar os dados do usuário.",
            );

            return;
          }

          // ==========================================
          // PREENCHE A TELA COM DADOS DO MYSQL
          // ==========================================

          document.getElementById("nomeTopo").innerText =
            dados.nome || "Usuário";

          document.getElementById("perfilNome").value = dados.nome || "";

          document.getElementById("perfilEmail").value = dados.email || "";

          document.getElementById("perfilCPF").value = dados.cpf || "";

          document.getElementById("perfilTelefone").value =
            dados.telefone || "";

          // ==========================================
          // ATUALIZA A SESSÃO DO NAVEGADOR
          // ==========================================

          localStorage.setItem("usuarioLogado", JSON.stringify(dados));
        } catch (erro) {
          console.error("Erro ao carregar usuário:", erro);

          alert("Não foi possível conectar com o servidor.");
        }
      }

      // ==========================================
      // LIBERAR EDIÇÃO
      // ==========================================

      function editarDados() {
        document.getElementById("perfilNome").disabled = false;

        document.getElementById("perfilTelefone").disabled = false;

        // E-mail e CPF continuam bloqueados

        document.getElementById("perfilEmail").disabled = true;

        document.getElementById("perfilCPF").disabled = true;

        document.getElementById("btnSalvarDados").style.display = "block";
      }

      // ==========================================
      // SALVAR ALTERAÇÕES
      // ==========================================

      async function salvarDados() {
        const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));

        if (!usuarioLogado || !usuarioLogado.id_usuario) {
          window.location.href = "Entrar.html";
          return;
        }

        const nome = document.getElementById("perfilNome").value.trim();

        const telefone = document.getElementById("perfilTelefone").value.trim();

        // Nome obrigatório

        if (!nome) {
          alert("Informe seu nome.");
          return;
        }

        try {
          const resposta = await fetch(
            `${API_URL}/api/usuarios/${usuarioLogado.id_usuario}`,
            {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                nome: nome,
                telefone: telefone,
              }),
            },
          );

          const dados = await resposta.json();

          if (!resposta.ok) {
            alert(dados.mensagem || "Não foi possível atualizar os dados.");

            return;
          }

          // ==========================================
          // ATUALIZA A SESSÃO LOCAL
          // ==========================================

          usuarioLogado.nome = nome;

          usuarioLogado.telefone = telefone;

          localStorage.setItem("usuarioLogado", JSON.stringify(usuarioLogado));

          alert("Dados atualizados com sucesso!");

          // Bloqueia novamente os campos

          document.getElementById("perfilNome").disabled = true;

          document.getElementById("perfilTelefone").disabled = true;

          document.getElementById("btnSalvarDados").style.display = "none";

          // Busca novamente do MySQL
          await carregarDadosUsuario();
        } catch (erro) {
          console.error("Erro ao atualizar usuário:", erro);

          alert("Não foi possível conectar com o servidor.");
        }
      }

      // ==========================================
      // SAIR DA CONTA
      // ==========================================

      function sairConta() {
        localStorage.removeItem("usuarioLogado");

        window.location.href = "index.html";
      }

      // ==========================================
      // INICIALIZAÇÃO
      // ==========================================

      carregarDadosUsuario();
    </script>
  </body>
</html>
